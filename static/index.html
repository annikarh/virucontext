<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ViruContext</title>
  <style>
    :root {
      --ink: #1c1917;
      --muted: #57534e;
      --line: #d6d3d1;
      --paper: #faf7f2;
      --card: #fffdf9;
      --accent: #9f1239;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background: var(--paper);
    }
    header, main { max-width: 820px; margin: 0 auto; padding: 1.5rem 1.25rem; }
    header h1 { font-size: 1.6rem; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
    header p { margin: 0; color: var(--muted); font-size: 0.98rem; }
    form {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
      display: grid;
      gap: 0.75rem;
    }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 0.25rem; }
    input {
      width: 100%;
      font: inherit;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    button {
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .status { color: var(--muted); font-size: 0.95rem; min-height: 1.4em; }
    .status.error { color: var(--accent); }
    .meta { font-size: 0.9rem; color: var(--muted); margin: 1rem 0; }
    .meta a { color: var(--accent); }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
      white-space: pre-wrap;
    }
    footer { max-width: 820px; margin: 0 auto; padding: 0 1.25rem 2rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>ViruContext</h1>
    <p>Open-access virology papers → field packet for writing, teaching, and tools.</p>
  </header>
  <main>
    <form id="form">
      <div>
        <label for="query">Paper title, DOI, PMID, PMCID, or OA link</label>
        <input id="query" name="query" required placeholder="High flavivirus structural plasticity demonstrated by a non-spherical morphological variant" />
      </div>
      <div>
        <label for="virus">Virus of interest (optional)</label>
        <input id="virus" name="virus" placeholder="e.g. DENV3 CH53489" />
      </div>
      <button type="submit" id="go">Summarize</button>
      <div class="status" id="status"></div>
    </form>
    <div class="meta" id="meta" hidden></div>
    <article id="packet" hidden></article>
  </main>
  <footer>
    OA full text via Europe PMC. Paywalled papers are refused. This page only works when the Python app is running with an API key.
  </footer>
  <script>
    const form = document.getElementById("form");
    const status = document.getElementById("status");
    const packet = document.getElementById("packet");
    const meta = document.getElementById("meta");
    const go = document.getElementById("go");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      packet.hidden = true;
      meta.hidden = true;
      status.className = "status";
      status.textContent = "Looking up open-access full text…";
      go.disabled = true;
      try {
        const res = await fetch("/api/summarize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query: document.getElementById("query").value,
            virus_of_interest: document.getElementById("virus").value || null,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || res.statusText);
        }
        const p = data.paper;
        meta.innerHTML = [
          p.title ? `<strong>${escapeHtml(p.title)}</strong>` : "",
          [p.journal, p.year].filter(Boolean).join(" "),
          p.oa_url ? `<a href="${p.oa_url}" target="_blank" rel="noopener">Europe PMC</a>` : "",
          p.doi ? `doi:${escapeHtml(p.doi)}` : "",
        ].filter(Boolean).join(" · ");
        meta.hidden = false;
        packet.textContent = data.packet;
        packet.hidden = false;
        status.textContent = "Done. Check isolate, temperature, and antibody clone before you cite.";
      } catch (err) {
        status.className = "status error";
        status.textContent = err.message || String(err);
      } finally {
        go.disabled = false;
      }
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&", "<": "<", ">": ">", '"': "&quot;", "'": "&#39;"
      })[c]);
    }
  </script>
</body>
</html>
